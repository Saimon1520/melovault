patchedDependencies:
  react-native-track-player@4.1.2: patches/react-native-track-player@4.1.2.patch

# Parches de seguridad para dependencias transitivas de las herramientas de build
# (Expo CLI / Metro / Babel). Misma versión mayor, solo la versión corregida.
overrides:
  browserslist@<4.28.7: ^4.28.7
  image-size@<2.0.3: ^2.0.3
  "@babel/runtime@<7.26.10": ^7.26.10
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  # Sin versión corregida publicada: copias locales con el parche (ver vendor/).
  deepmerge: file:./vendor/deepmerge
  zod@3: file:./vendor/zod-v3
