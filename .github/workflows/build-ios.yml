name: Build iOS IPA (EAS)

# Manual-only (needs an EXPO_TOKEN secret). Was failing on every pushed tag.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS with EAS
        run: eas build --platform ios --non-interactive --profile production

      - name: Note
        run: |
          echo "iOS IPA built via EAS Build."
          echo "Download from: https://expo.dev/accounts/[account]/projects/melovault/builds"
